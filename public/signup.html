<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    form { max-width: 400px; margin: auto; display: flex; flex-direction: column; }
    input, button { margin: 8px 0; padding: 10px; font-size: 1rem; }
    button { cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
    button:hover { background: #0056b3; }
    .message { margin-top: 10px; font-size: 0.9rem; }
  </style>
</head>
<body>

  <h2>Create an Account</h2>
  <form id="registerForm">
    <input type="text" id="name" placeholder="Full Name" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Register</button>
    <div id="responseMessage" class="message"></div>
  </form>

  <script>
    const API_BASE_URL = "https://learntrack.up.railway.app"; // Railway backend only

    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const responseMessage = document.getElementById("responseMessage");

      try {
        const res = await fetch(`${API_BASE_URL}/auth/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, password })
        });

        if (!res.ok) {
          const text = await res.text();
          throw new Error(`Server error: ${res.status} - ${text}`);
        }

        const data = await res.json();
        responseMessage.style.color = "green";
        responseMessage.textContent = data.message || "Registration successful!";
      } catch (err) {
        responseMessage.style.color = "red";
        responseMessage.textContent = "Error: " + err.message;
      }
    });
  </script>

</body>
</html>
