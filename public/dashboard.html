<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - LearnTrack</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.9)), url('https://images.unsplash.com/photo-1504384308090-c894fdcc538d?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff;
            min-height: 100vh;
            display: flex;
        }

        /* Sidebar Styles */
        .sidebar {
            width: 260px;
            background: rgba(15, 15, 30, 0.8);
            backdrop-filter: blur(10px);
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            padding: 30px 0;
            border-right: 1px solid rgba(0, 198, 255, 0.2);
            display: flex;
            flex-direction: column;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 0 30px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 30px;
        }

        .logo i {
            font-size: 32px;
            color: #00c6ff;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            list-style: none;
            padding: 0 20px;
        }

        .nav-links li {
            margin-bottom: 10px;
        }

        .nav-links a {
            display: flex;
            align-items: center;
            gap: 15px;
            color: #e0e0e0;
            text-decoration: none;
            font-size: 16px;
            padding: 12px 20px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .nav-links a:hover, .nav-links a.active {
            background: rgba(0, 198, 255, 0.15);
        }

        .nav-links a i {
            font-size: 18px;
            width: 24px;
            text-align: center;
            color: #00c6ff;
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            margin-left: 260px;
            padding: 30px;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            margin-bottom: 30px;
        }

        .user-greeting h1 {
            font-size: 28px;
            font-weight: 500;
        }

        .user-greeting p {
            color: #00c6ff;
            font-size: 16px;
            margin-top: 5px;
        }

        .signup-btn {
            background: linear-gradient(to right, #00c6ff, #0072ff);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .signup-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 114, 255, 0.4);
        }

        /* Progress Cards */
        .section-title {
            font-size: 24px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(0, 198, 255, 0.3);
            display: inline-block;
        }

        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }

        .course-card {
            background: rgba(15, 15, 30, 0.7);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 198, 255, 0.2);
            transition: all 0.3s ease;
        }

        .course-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.5);
        }

        .course-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .course-title {
            font-size: 20px;
            font-weight: 600;
        }

        .course-category {
            background: rgba(0, 198, 255, 0.2);
            color: #00c6ff;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        .progress-container {
            margin: 25px 0;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
            color: #b0b0b0;
        }


        .progress-fill {
            height: 100%;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            border-radius: 5px;
        }

        .progress-percent {
            text-align: right;
            font-size: 14px;
            color: #00c6ff;
            margin-top: 5px;
            font-weight: 600;
        }

        .course-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .course-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .course-status i {
            color: #00c6ff;
        }

        .continue-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .continue-btn:hover {
            background: rgba(0, 198, 255, 0.2);
        }

        /* Responsive Design */
        @media (max-width: 992px) {
            .sidebar {
                width: 220px;
            }
            
            .main-content {
                margin-left: 220px;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 70px;
                overflow: hidden;
            }
            
            .logo span, .nav-links a span {
                display: none;
            }
            
            .logo {
                justify-content: center;
                padding: 0 0 30px;
            }
            
            .main-content {
                margin-left: 70px;
            }
            
            .top-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }
        }

        @media (max-width: 576px) {
            .main-content {
                padding: 20px 15px;
                margin-left: 0;
                padding-top: 80px;
            }
            
            .sidebar {
                width: 100%;
                height: auto;
                bottom: 0;
                top: auto;
                z-index: 100;
                flex-direction: row;
                padding: 10px;
                height: 70px;
            }
            
            .logo {
                display: none;
            }
            
            .nav-links {
                display: flex;
                width: 100%;
                justify-content: space-around;
                padding: 0;
            }
            
            .nav-links li {
                margin: 0;
            }
            
            .nav-links a {
                flex-direction: column;
                gap: 5px;
                padding: 10px;
                font-size: 12px;
            }
            
            .nav-links a i {
                font-size: 20px;
            }
            
            .courses-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo">
            <i class="fas fa-graduation-cap"></i>
            <span class="logo-text">LearnTrack</span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html" class="active"><i class="fas fa-home"></i> <span>Home</span></a></li>
            <li><a href="Courses.html"><i class="fas fa-book"></i> <span>Courses</span></a></li>
            <li><a href=" community2.html"><i class="fas fa-users"></i> <span>Community</span></a></li>
                <li><a href="UserProfile.html"><i class="fas fa-user-alt"></i> <span>User Details</span></a></li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="user-greeting">
                <h1>Hi, Khomotso</h1>

            </div>
            <a href="index.html" class="signup-btn">Log out</a>
        </div>

        <!-- Progress Cards -->
        <h2 class="section-title">My Courses</h2>
        <div class="courses-grid">
      

            <!-- Course 2 -->
            <div class="course-card">
                <div class="course-header">
                    <h3 class="course-title">Go to course page to enroll</h3>
                
                </div>
            </div>

          

            
        </div>

        <!-- Additional Section -->
        <h2 class="section-title">Recommended for You</h2>
        <div class="courses-grid">
            <!-- Recommended Course 1 -->
            <div class="course-card">
                <div class="course-header">
                    <h3 class="course-title">Web Development</h3>
                    <span class="course-category">Specialization</span>
                </div>
                <div class="progress-container">
                    <div class="progress-info">
                        <span>New Course</span>
                        <span>0%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 0%"></div>
                    </div>
                    <div class="progress-percent">Start Learning</div>
                </div>
                <div class="course-footer">
                    <div class="course-status">
                        <i class="fas fa-star"></i>
                        <span>Popular this month</span>
                    </div>
                    <button class="continue-btn">Enroll Now</button>
                </div>
            </div>

            <!-- Recommended Course 2 -->
            <div class="course-card">
                <div class="course-header">
                    <h3 class="course-title">Digital Marketing</h3>
                    <span class="course-category">Course</span>
                </div>
                <div class="progress-container">
                    <div class="progress-info">
                        <span>New Course</span>
                        <span>0%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 0%"></div>
                    </div>
                    <div class="progress-percent">Start Learning</div>
                </div>
                <div class="course-footer">
                    <div class="course-status">
                        <i class="fas fa-star"></i>
                        <span>Trending</span>
                    </div>
                    <button class="continue-btn">Enroll Now</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Simple animation for progress bars
        document.addEventListener('DOMContentLoaded', function() {
            const progressBars = document.querySelectorAll('.progress-fill');
            
            progressBars.forEach(bar => {
                const width = bar.style.width;
                bar.style.width = '0';
                
                setTimeout(() => {
                    bar.style.transition = 'width 1s ease-in-out';
                    bar.style.width = width;
                }, 300);
            });
        });
    </script>
</body>
</html>
